name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('src/manifest.json')); print('manifest.json is valid')"
      - name: Check JS syntax
        run: |
          for f in $(find src -name "*.js"); do
            node --check "$f" && echo "OK: $f"
          done

  package:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          mkdir -p dist
          cd src && zip -r ../dist/sloptotal-extension.zip . -x ".*" -x "generate_icons.py"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/sloptotal-extension.zip
